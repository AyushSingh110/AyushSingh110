<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-label="Animated agent trace timeline: spans stream in, a tool call times out, a replay head sweeps the timeline, and a diagnosis resolves the failure.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .lbl  { font-size: 12px; fill: #57606a; }
    .hdr  { font-size: 12px; fill: #57606a; }
    .tag  { font-size: 10px; fill: #cf222e; opacity: 0; }
    .diag { font-size: 11px; fill: #57606a; opacity: 0; }
    .rule { stroke: #d0d7de; stroke-width: 1; }
    .tick { stroke: #d0d7de; stroke-width: 1; stroke-dasharray: 2 6; }
    .trk  { fill: #eaeef2; }

    .bar  { fill: #0969da; transform-box: fill-box; transform-origin: left center;
            animation: grow 10s cubic-bezier(.2,.8,.3,1) infinite; }
    .b1 { animation-delay: .30s }
    .b2 { animation-delay: .58s }
    .b3 { animation-delay: .86s }
    .b5 { animation-delay: 1.42s }
    .b6 { animation-delay: 1.70s }
    .b4 { animation: grow 10s cubic-bezier(.2,.8,.3,1) infinite, fail 10s linear infinite;
          animation-delay: 1.14s, 0s; }

    @keyframes grow {
      0%   { transform: scaleX(0); opacity: .85 }
      5%   { transform: scaleX(1); opacity: 1 }
      84%  { transform: scaleX(1); opacity: 1 }
      90%  { transform: scaleX(0); opacity: 0 }
      100% { transform: scaleX(0); opacity: 0 }
    }
    @keyframes fail {
      0%, 30%   { fill: #0969da }
      33%, 100% { fill: #cf222e }
    }

    .scan { stroke: #0969da; stroke-width: 1.5; animation: scan 10s cubic-bezier(.4,0,.3,1) infinite; }
    .glow { fill: url(#g); animation: scan 10s cubic-bezier(.4,0,.3,1) infinite; }
    @keyframes scan {
      0%, 43%   { opacity: 0; transform: translateX(0) }
      45%       { opacity: 1; transform: translateX(0) }
      70%       { opacity: 1; transform: translateX(654px) }
      74%, 100% { opacity: 0; transform: translateX(654px) }
    }

    .t-cap { animation: cap 10s linear infinite }
    @keyframes cap { 0%, 40% { opacity: 1 } 43%, 100% { opacity: 0 } }
    .t-rep { opacity: 0; animation: rep 10s linear infinite }
    @keyframes rep { 0%, 43% { opacity: 0 } 46%, 86% { opacity: 1 } 90%, 100% { opacity: 0 } }

    .g-tag { animation: tag 10s linear infinite }
    @keyframes tag { 0%, 33% { opacity: 0 } 37%, 86% { opacity: 1 } 90%, 100% { opacity: 0 } }
    .g-tag2 { animation: tag2 10s linear infinite }
    @keyframes tag2 { 0%, 55% { opacity: 0 } 59%, 86% { opacity: 1 } 90%, 100% { opacity: 0 } }

    .g-diag { animation: diag 10s linear infinite }
    @keyframes diag { 0%, 72% { opacity: 0 } 76%, 88% { opacity: 1 } 92%, 100% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .bar, .b4, .scan, .glow, .t-cap, .t-rep, .g-tag, .g-tag2, .g-diag { animation: none }
      .bar { transform: scaleX(1) }
      .b4 { fill: #cf222e }
      .tag, .diag { opacity: 1 }
      .t-cap { opacity: 0 }
      .scan, .glow { opacity: 0 }
    }
  </style>

  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="1" stop-color="#0969da" stop-opacity=".12"/>
    </linearGradient>
  </defs>

  <text class="mono hdr" x="16" y="28">trace &#183; agent.run/4182</text>
  <text class="mono hdr t-cap" x="824" y="28" text-anchor="end">capture</text>
  <text class="mono hdr t-rep" x="824" y="28" text-anchor="end" fill="#0969da">replay</text>
  <line class="rule" x1="16" y1="44" x2="824" y2="44"/>

  <line class="tick" x1="170" y1="58" x2="170" y2="216"/>
  <line class="tick" x1="333" y1="58" x2="333" y2="216"/>
  <line class="tick" x1="496" y1="58" x2="496" y2="216"/>
  <line class="tick" x1="659" y1="58" x2="659" y2="216"/>
  <line class="tick" x1="822" y1="58" x2="822" y2="216"/>

  <rect class="trk" x="170" y="65"  width="654" height="10" rx="3"/>
  <rect class="trk" x="170" y="92"  width="654" height="10" rx="3"/>
  <rect class="trk" x="170" y="119" width="654" height="10" rx="3"/>
  <rect class="trk" x="170" y="146" width="654" height="10" rx="3"/>
  <rect class="trk" x="170" y="173" width="654" height="10" rx="3"/>
  <rect class="trk" x="170" y="200" width="654" height="10" rx="3"/>

  <text class="mono lbl" x="16" y="74">agent.plan</text>
  <text class="mono lbl" x="16" y="101">tool.search</text>
  <text class="mono lbl" x="16" y="128">llm.call</text>
  <text class="mono lbl" x="16" y="155">tool.fetch</text>
  <text class="mono lbl" x="16" y="182">llm.call</text>
  <text class="mono lbl" x="16" y="209">validate.output</text>

  <rect class="bar b1" x="170" y="65"  width="95"  height="10" rx="3"/>
  <rect class="bar b2" x="205" y="92"  width="130" height="10" rx="3"/>
  <rect class="bar b3" x="290" y="119" width="215" height="10" rx="3"/>
  <rect class="bar b4" x="430" y="146" width="165" height="10" rx="3"/>
  <rect class="bar b5" x="515" y="173" width="195" height="10" rx="3"/>
  <rect class="bar b6" x="620" y="200" width="105" height="10" rx="3"/>

  <text class="mono tag g-tag"  x="603" y="155">timeout 30s</text>
  <text class="mono tag g-tag2" x="733" y="209">assert failed</text>

  <g>
    <rect class="glow" x="130" y="58" width="40" height="158"/>
    <line class="scan" x1="170" y1="56" x2="170" y2="218"/>
  </g>

  <text class="mono diag g-diag" x="16" y="238">tool.fetch timed out &#8594; llm.call answered from stale context &#8594; <tspan fill="#cf222e">validate.output assert failed</tspan></text>
</svg>
