<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" role="img" aria-label="A terminal running an agent regression suite: the command types itself, result rows land one by one with a failing case in red, and a summary reports two regressions caught.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .panel { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .dot   { fill: #d0d7de; }
    .hdr   { font-size: 11px; fill: #6e7781; }
    .sep   { stroke: #eaeef2; stroke-width: 1; }
    .pr    { font-size: 13px; fill: #6e7781; }
    .cmd   { font-size: 13px; fill: #1f2328; }
    .pass  { font-size: 13px; fill: #1a7f37; }
    .fail  { font-size: 13px; fill: #cf222e; }
    .name  { font-size: 13px; fill: #24292f; }
    .num   { font-size: 13px; fill: #6e7781; }
    .note  { font-size: 12px; fill: #cf222e; }
    .sum   { font-size: 11.5px; fill: #6e7781; }
    .sumhi { fill: #24292f; }
    .failbg { fill: #cf222e; opacity: .07; }
    .failbar { fill: #cf222e; }

    .stage { animation: stage 11s linear infinite; }
    @keyframes stage { 0%, 86% { opacity: 1 } 93%, 100% { opacity: 0 } }

    .typed { animation: type 11s steps(34, end) infinite; transform-box: fill-box; transform-origin: left center; }
    @keyframes type { 0%, 3% { transform: scaleX(0) } 19%, 100% { transform: scaleX(1) } }

    .caret { fill: #0969da; animation: caret 11s steps(34, end) infinite, blink 1.06s steps(2, start) infinite; }
    @keyframes caret { 0%, 3% { transform: translateX(0) } 19%, 100% { transform: translateX(265px) } }
    @keyframes blink { 0% { opacity: 1 } 50% { opacity: 0 } }

    .r { opacity: 0; transform-box: fill-box; }
    .r1 { animation: r1 11s cubic-bezier(.2,.8,.3,1) infinite }
    .r2 { animation: r2 11s cubic-bezier(.2,.8,.3,1) infinite }
    .r3 { animation: r3 11s cubic-bezier(.2,.8,.3,1) infinite }
    .r4 { animation: r4 11s cubic-bezier(.2,.8,.3,1) infinite }
    .r5 { animation: r5 11s cubic-bezier(.2,.8,.3,1) infinite }
    @keyframes r1 { 0%, 24% { opacity: 0; transform: translateY(5px) } 27%, 100% { opacity: 1; transform: translateY(0) } }
    @keyframes r2 { 0%, 29% { opacity: 0; transform: translateY(5px) } 32%, 100% { opacity: 1; transform: translateY(0) } }
    @keyframes r3 { 0%, 34% { opacity: 0; transform: translateY(5px) } 37%, 100% { opacity: 1; transform: translateY(0) } }
    @keyframes r4 { 0%, 39% { opacity: 0; transform: translateY(5px) } 42%, 100% { opacity: 1; transform: translateY(0) } }
    @keyframes r5 { 0%, 47% { opacity: 0; transform: translateY(5px) } 51%, 100% { opacity: 1; transform: translateY(0) } }

    .flash { animation: flash 11s ease-out infinite }
    @keyframes flash { 0%, 34% { opacity: 0 } 37% { opacity: .22 } 44%, 100% { opacity: .07 } }

    @media (prefers-reduced-motion: reduce) {
      .stage, .typed, .caret, .r1, .r2, .r3, .r4, .r5, .flash { animation: none }
      .typed { transform: scaleX(1) }
      .caret { opacity: 0 }
      .r { opacity: 1; transform: none }
    }
  </style>

  <defs>
    <clipPath id="reveal">
      <rect class="typed" x="44" y="70" width="272" height="20"/>
    </clipPath>
  </defs>

  <rect class="panel" x="8" y="8" width="804" height="274" rx="8"/>

  <circle class="dot" cx="30" cy="31" r="4"/>
  <circle class="dot" cx="46" cy="31" r="4"/>
  <circle class="dot" cx="62" cy="31" r="4"/>
  <text class="mono hdr" x="84" y="35">evals &#183; agent-regression</text>
  <line class="sep" x1="8" y1="52" x2="812" y2="52"/>

  <g class="stage">
    <text class="mono pr" x="28" y="86">$</text>
    <g clip-path="url(#reveal)">
      <text class="mono cmd" x="44" y="86" textLength="265" lengthAdjust="spacing">evals run --suite agent-regression</text>
    </g>
    <rect class="caret" x="44" y="74" width="7" height="15"/>

    <g class="r r1">
      <text class="mono pass" x="40"  y="122">PASS</text>
      <text class="mono name" x="96"  y="122">tool_selection</text>
      <text class="mono num"  x="320" y="122">42/42</text>
    </g>

    <g class="r r2">
      <text class="mono pass" x="40"  y="148">PASS</text>
      <text class="mono name" x="96"  y="148">context_grounding</text>
      <text class="mono num"  x="320" y="148">18/18</text>
    </g>

    <g class="r r3">
      <rect class="failbg flash" x="16" y="158" width="788" height="24" rx="4"/>
      <rect class="failbar" x="16" y="158" width="2" height="24"/>
      <text class="mono fail" x="40"  y="174">FAIL</text>
      <text class="mono name" x="96"  y="174">refusal_boundary</text>
      <text class="mono num"  x="320" y="174">31/33</text>
      <text class="mono note" x="420" y="174">2 regressions</text>
    </g>

    <g class="r r4">
      <text class="mono pass" x="40"  y="200">PASS</text>
      <text class="mono name" x="96"  y="200">latency_budget</text>
      <text class="mono num"  x="320" y="200">12/12</text>
    </g>

    <g class="r r5">
      <line class="sep" x1="28" y1="222" x2="792" y2="222"/>
      <text class="mono sum" x="40" y="250"><tspan class="sumhi">3</tspan> prompts changed &#160;&#183;&#160; <tspan class="sumhi">2</tspan> regressions caught &#160;&#183;&#160; <tspan class="sumhi">1.8s</tspan></text>
    </g>
  </g>
</svg>
